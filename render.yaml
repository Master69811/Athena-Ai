# ──────────────────────────────────────────────────────────────
# Athena AI — Render Blueprint
# Deploy: dashboard.render.com → New → Blueprint → select this repo.
# Creates: API (Docker) + PostgreSQL + Redis (Key Value).
# Qdrant: use Qdrant Cloud free tier (cloud.qdrant.io) and set
# QDRANT_URL + QDRANT_API_KEY in the dashboard when prompted.
# ──────────────────────────────────────────────────────────────
services:
  - type: web
    name: athena-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: athena-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: athena-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      # Set these in the Render dashboard on first deploy:
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      # Optional extras (set in dashboard if needed):
      # CORS_ORIGINS   — comma-separated additional allowed origins (e.g. Vercel preview URLs)
      # SWAGGER_ENABLED — "true" to expose /docs in production (off by default)

  - type: keyvalue
    name: athena-redis
    plan: free
    ipAllowList: [] # internal connections only

databases:
  - name: athena-db
    plan: free
    databaseName: athena_db
    user: athena
